name: Release-Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # PAT identity (not GITHUB_TOKEN) so:
          #   - the release PR's pull_request event fires CI (otherwise
          #     GitHub suppresses workflow triggers from GITHUB_TOKEN actions)
          #   - the release-published event fires release-artifacts.yml
          #     for the same reason
          # If RELEASE_PLEASE_TOKEN is unset, the action falls back to
          # GITHUB_TOKEN and you'll need to close+reopen each release PR by
          # hand to wake up CI. See CONTRIBUTING.md for PAT setup.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
